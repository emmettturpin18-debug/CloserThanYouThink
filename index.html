const ORD={first:1,second:2,third:3,fifth:5,eighth:8,ninth:9,twelfth:12,twentieth:20,thirtieth:30};
function wv(w){if(w==='oh')return[0,0];if(w==='hundred')return[100,0];if(w==='thousand')return[1000,0];if(ONES.includes(w))return[ONES.indexOf(w),0];if(TENS[w])return[TENS[w],0];
 if(ORD[w])return[ORD[w],1];if(w.endsWith('th')&&ONES.includes(w.slice(0,-2)))return[ONES.indexOf(w.slice(0,-2)),1];return null}

 if(w.length<4)return 0;let best=0,bd=9;for(let i=0;i<12;i++){const dd=lev(w,MN[i]);if(dd<bd){bd=dd;best=i+1}}return bd<=(w.length<=5?1:2)?best:0}
const okDay=(y,m,d)=>!d||(m>0&&d>=1&&d<=new Date(Date.UTC(y,m,0)).getUTCDate());
function parseDate(raw){
 let s=String(raw||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();if(!s)return{err:'Type a date first.'};
 let m=s.match(/\b(\d{4})-(\d{1,2})-(\d{1,2})\b/);if(m){const[y,mo,d]=[+m[1],+m[2],+m[3]];return mo>=1&&mo<=12&&okDay(y,mo,d)?{cands:[{y,m:mo,d,p:3}]}:{err:'That date does not exist.'}}
 m=s.match(/\b(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})\b/);if(m){const a=+m[1],b=+m[2],y=+m[3],c=[];
  if(a<=12&&okDay(y,a,b))c.push({y,m:a,d:b,p:3});if(b<=12&&a!==b&&okDay(y,b,a))c.push({y,m:b,d:a,p:3});return c.length?{cands:c}:{err:'That date does not exist.'}}

 if(ds.length&&!um.length)return{err:'I found a day but no month. Try "July 20, 1969".'};if(ds.length>1&&new Set(ds).size>1)return{err:'I found more than one day. Please type just one date.'};
 const c=[];for(const y of uy)if(!um.length)c.push({y,m:0,d:0,p:1});else for(const mo of um){const d=ds[0]||0;if(okDay(y,mo,d))c.push({y,m:mo,d,p:d?3:2})}

const bell=()=>{if(!st.pf.snd)return;try{const a=new AudioContext(),o=a.createOscillator();o.frequency.value=660;o.connect(a.destination);o.start();o.stop(a.currentTime+.12)}catch(e){}};
function opts(q){const o=[{y:q.y,m:q.m,d:q.d,p:q.p}],rg={easy:[40,120],medium:[12,45],hard:[3,14]}[S.diff],seen=new Set([q.y]);let g=0;
 while(o.length<4&&g++<500){const off=(rg[0]+rnd(rg[1]-rg[0]))*(rnd(2)?1:-1),y=q.y+off;if(y<1526||y>2026||seen.has(y))continue;seen.add(y);o.push({y,m:q.p>1?1+rnd(12):0,d:q.p>2?1+rnd(28):0,p:q.p})}
 return o.sort((a,b)=>U(a,3)-U(b,3))}
function pie(sc,cur,fresh){const R=80,pt=(i,r)=>{const a=(-90+i*36)*Math.PI/180;return[(100+r*Math.cos(a)).toFixed(2),(100+r*Math.sin(a)).toFixed(2)]};
 let h='<svg class="pie" viewBox="0 0 200 200" role="img" aria-label="Pie with 10 slices"><circle cx="100" cy="100" r="95" fill="#d9a55b" stroke="#8a4b1f" stroke-width="5"/><circle cx="100" cy="100" r="85" fill="#f6e3b4" stroke="#8a4b1f" stroke-width="2"/>';
 for(let i=0;i<10;i++){const a=pt(i,R),b=pt(i+1,R),d=`M100 100L${a[0]} ${a[1]}A${R} ${R} 0 0 1 ${b[0]} ${b[1]}Z`,s=sc[i],f=s?Math.min(1,s.pts/.1):0;
  h+=`<path d="${d}" fill="#fbefd0" stroke="#8a4b1f" stroke-width="1.5"/><path class="fill" data-f="${f}" d="${d}" fill="${st.pf.pie}" stroke="#5b2a0c" stroke-width="1" style="transform-origin:100px 100px;transform:scale(${i===fresh&&!RM&&st.pf.anim?0:f})"/>`;
  if(i===cur)h+=`<path d="${d}" fill="none" stroke="#1a5fd0" stroke-width="3" stroke-dasharray="4 3"/>`}
 for(let i=0;i<10;i++){const a=pt(i,R);h+=`<line x1="100" y1="100" x2="${a[0]}" y2="${a[1]}" stroke="#8a4b1f" stroke-width="1"/>`}
 return h+'<circle cx="100" cy="100" r="8" fill="#d9a55b" stroke="#8a4b1f" stroke-width="2"/></svg>'}
const tot=a=>a.reduce((s,x)=>s+(x?x.pts:0),0),pc=v=>(v*100).toFixed(1)+'%';
function band(p){return p>=90?'90–100% Pie Master':p>=70?'70–89% Super Baker':p>=40?'40–69% Good Cook':'10–39% Keep Baking'}
function view(){const q=S.qs&&S.qs[S.qi],h=[];
 switch(S.scr){
 case 'home':h.push(top(70)+`<h1>Closer Than You Think</h1><p>Guess when it happened. The closer you are, the more pie you win! Sample bank: ${EV.length} events, 1526 through December 25, 2021.</p><button class="big go" data-a="m" data-v="easy">Easy Mode<br><small>Pick a date</small></button><button class="big" data-a="m" data-v="hard">Hard Mode<br><small>Type a date</small></button>`);break;
 case 'mode':h.push(`<h2>Choose a mode</h2><button class="big go" data-a="m" data-v="easy">Easy Mode – multiple choice</button><button class="big" data-a="m" data-v="hard">Hard Mode – type the date</button>`);break;
 case 'diff':h.push(`<h2>${S.mode==='easy'?'Easy':'Hard'} Mode: how hard?</h2>`+['easy','medium','hard'].map(d=>`<button class="big" data-a="d" data-v="${d}">${d[0].toUpperCase()+d.slice(1)}</button>`).join('')+`<button data-a="go" data-v="mode">Back</button>`);break;
 case 'setup':h.push(`<h2>Players</h2><div role="group" aria-label="Number of players">`+[1,2,3,4].map(n=>`<button class="${S.np===n?'sel':''}" data-a="np" data-v="${n}">${n}</button>`).join(' ')+`</div>`+[...Array(S.np)].map((_,i)=>`<label>Nickname ${i+1} (no real names)<input type="text" maxlength="12" data-n="${i}" value="${esc(S.names[i])}" placeholder="Player ${i+1}"></label>`).join('')+`<button class="big go" data-a="start">Start 10-question round</button><button data-a="go" data-v="diff">Back</button>`);break;
 case 'play':{const pn=S.names[S.pi];
  if(S.step==='pass'){h.push(`<div class="card"><h2>Pass to ${esc(pn)}</h2><p>No peeking! Everyone else look away.</p><button class="big go" data-a="ready">I'm ready</button></div>`);break}
  h.push(top(40)+`<p class="px">Question ${S.qi+1} of ${S.qs.length} · ${esc(pn)}</p>`+pie(S.sc[S.pi],S.qi,S.step==='reveal'?S.qi:-1));
  if(S.step==='ask'){const e=S.diff;h.push(`<div class="card"><h2>${esc(q.t)}</h2>`+(e!=='hard'?`<p>${esc(q.c)}</p>`:`<p>Region: ${esc(q.rg)} · Topic: ${esc(q.tp)}</p>`)+(e==='easy'?`<div class="tl" aria-hidden="true"><i style="left:${Math.max(0,(q.y-30-1526)/5)}%;width:${Math.min(100,60/5)}%"></i></div><small>Green bar = about when. Left is long ago, right is now. ${q.y<1800?'Long, long ago!':q.y<1950?'A long time ago.':'Not so long ago.'}</small><br><button data-a="say">🔊 Read aloud</button>`:'')+`</div>`);
   h.push(abUI());S.hints.forEach(t=>h.push(`<p class="card hint">${esc(t)}</p>`));
   if(S.mode==='easy')h.push(`<div class="opts">`+S.o.map((o,i)=>`<button data-a="pick" data-v="${i}"${S.locked?' disabled':''}>${fmt(o)}</button>`).join('')+`</div>`);
   else{h.push(`<label>Your date (like "July 20, 1969" or just "1969")<input type="text" id="ans" autocomplete="off" value="${esc(S.txt||'')}"></label>`);if(S.cands)h.push(`<p>Which did you mean?</p>`+S.cands.map((c,i)=>`<button data-a="cand" data-v="${i}">${fmt(c)}</button>`).join(''));
    h.push(`<button class="big go" data-a="sub"${S.locked?' disabled':''}>Submit Answer</button>`)}
   if(S.msg)h.push(`<p class="msg" role="alert">${esc(S.msg)}</p>`);h.push(`<button data-a="skip"${S.locked?' disabled':''}>Skip (small slice)</button>`)}
  else{const r=S.sc[S.pi][S.qi];h.push(`<div class="card"><h2>${r.sk?'Skipped':'You earned '+pc(r.pts)+' of the pie!'}</h2><p>Answer: <b>${fmt(q)}</b>${r.a?`<br>Your guess: ${fmt(r.a)}`:''}</p><p>${esc(q.c)} <a href="${q.w}" target="_blank" rel="noopener">Source</a></p><p>This slice: ${(r.pts*100).toFixed(0)}% of the pie. Total: ${pc(tot(S.sc[S.pi]))}</p></div><button class="big go" data-a="next">${S.qi+1===S.qs.length&&S.pi===S.np-1?'See results':'Next'}</button>`)}
  h.push(`<button data-a="end">End Round</button>`);break}
 case 'sum':{const early=S.early,N=S.qs.length;h.push(`<h2>Round summary — ${early?'Incomplete (ended early)':'Completed'}</h2>`);
  const T=S.sc.map(tot);h.push(rewards());
  S.names.slice(0,S.np).forEach((n,i)=>{const c=S.sc[i].filter(Boolean).length;h.push(`<div class="card"><b>${esc(n)}</b>: ${pc(T[i])} earned · ${c}/${N} answered · possible ${pc(c*.1)}${early?'':' · '+band(T[i]*100)}${pie(S.sc[i],-1,-1)}</div>`)});
  if(early)h.push('<p>Incomplete rounds are not compared as winners.</p>');else{const mx=Math.max(...T),w=T.map((t,i)=>t===mx?i:-1).filter(i=>i>=0);h.push(S.np>1?`<h2>${w.length>1?'It\'s a tie!':'Winner: '+esc(S.names[w[0]])}</h2>`:'')}
  h.push(`<div class="card" style="overflow-x:auto"><table><tr><th>Event</th><th>Date</th>${S.names.slice(0,S.np).map(n=>`<th>${esc(n)}</th>`).join('')}</tr>`+S.qs.map((x,i)=>`<tr><td>${esc(x.t)}</td><td>${fmt(x)}</td>${S.sc.map(s=>`<td>${s[i]?(s[i].a?fmt(s[i].a):'skip'):'—'}</td>`).join('')}</tr>`).join('')+'</table></div><button class="big go" data-a="again">Play Again</button><button class="big" data-a="go" data-v="home">Main Menu</button>');break}
 case 'custom':h.push(shop());break;
 case 'rank':{const hs=st.h.filter(x=>x.r!==false).sort((a,b)=>b.s-a.s||b.t-a.t);h.push(`<h2>Rankings</h2><div class="card"><b>This Device</b> (saved only in this browser: nickname, score, mode, difficulty, date, status)<table><tr><th>#</th><th>Nick</th><th>Score</th><th>Mode</th><th>Done?</th></tr>`+(hs.slice(0,10).map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.n)}</td><td>${r.s.toFixed(1)}%</td><td>${r.m}/${r.d}</td><td>${r.c?'Yes':'Incomplete'}</td></tr>`).join('')||'<tr><td colspan=5>No plays yet.</td></tr>')+`</table><small>Ranked table excludes rounds where abilities were used. Sorted by score, then newest. Bands: 10–39%, 40–69%, 70–89%, 90–100%. These are score bands, not percentiles.</small></div><div class="card"><b>Recent plays</b><ul>`+[...st.h].reverse().slice(0,8).map(r=>`<li>${esc(r.n)} ${r.s.toFixed(1)}% ${r.m}/${r.d} ${new Date(r.t).toLocaleDateString()}${r.r===false?' (casual)':''}</li>`).join('')+`</ul></div><div class="card"><b>Global Leaderboard</b><br>Not set up: no shared backend is configured, so nothing here is shared with other players.</div>`);break}
 case 'how':h.push(`<h2>How to Play</h2><div class="card"><p>Read the event, guess the date. A full pie = 100%; each of 10 questions is worth one slice (10%).</p><p><b>Score per question</b> = 0.01 + 0.09 × closeness. Exact = 0.10 (full slice). Wrong or skipped = 0.01 (10% of a slice). Ended-early unanswered questions earn nothing.</p><p><b>Closeness</b> falls evenly to 0 over a window: Easy 40 years, Medium 20 years, Hard 8 years. Only the precision the question has is compared (year, month, or exact day). Typing less than a question asks for gives partial credit.</p><p><b>Difficulty</b>: Easy shows the clue, a timeline and far-apart choices; Medium shows the clue; Hard shows only the title and region, with close choices. Easy Mode = pick from 4 dates; Hard Mode = type a date like "July twentieth, 1969".</p><p>Pass-and-play for 2–4 players: everyone answers the same questions.</p><p><b>Pie Coins and XP</b> come from every answer (even wrong ones) and from finishing rounds. Spend coins in Customize on characters, stages and effects. Abilities are optional helpers; they never lower the 1% minimum, and Golden Crust never lifts a slice above 10%. Rounds with abilities are casual and not ranked. Your level never locks a difficulty.</p></div>`);break}
 return h.join('')}
function render(){$('#app').className=(!st.pf.anim)?'noanim':'';$('#app').innerHTML=view();
 const act=S.scr==='home'?'home':['mode','diff','setup','play','sum'].includes(S.scr)?'mode':S.scr;
 $('#nav').innerHTML=NAV.map(([k,l])=>`<button data-a="go" data-v="${k}" ${k===act?'aria-current="page"':''}>${l}</button>`).join('');
 requestAnimationFrame(()=>document.querySelectorAll('.fill').forEach(e=>e.style.transform=`scale(${e.dataset.f})`));
 const a=$('#ans');if(S.burst){S.burst=0;burst(10)}if(a&&S.focus){a.focus();S.focus=0}}
function submit(a){if(S.locked)return;S.locked=true;const q=S.qs[S.qi],sk=!a;let pts=points(q,a,S.diff);if(S.ab.gold&&!sk)pts=Math.min(.1,+(pts+.01).toFixed(4));addCoins(3+(pts>=.08?2:0));addXP(5);save();S.burst=1;S.sc[S.pi][S.qi]={pts,a,sk};S.step='reveal';S.msg='';S.cands=null;S.txt='';S.hints=[];bell();render()}
function finish(early){S.early=early;const N=S.qs.length;if(!early){addCoins(10);addXP(20)}else addXP(5);save();S.names.slice(0,S.np).forEach((n,i)=>{const c=S.sc[i].filter(Boolean).length;st.h.push({n,s:+(tot(S.sc[i])*100).toFixed(1),m:S.mode,d:S.diff,t:Date.now(),c:!early&&c===N,r:!S.used.length})});st.h=st.h.slice(-200);save();S.scr='sum';render()}
function act(a,v){switch(a){
 case 'go':S.scr=v;S.msg='';break;case 'm':S.mode=v;S.scr='diff';break;case 'd':S.diff=v;S.scr='setup';break;case 'np':S.np=+v;break;
 case 'start':S.names=S.names.map((n,i)=>(n.trim()||'Player '+(i+1)).slice(0,12));{const pool=S.diff==='easy'?[...shuf(EV.filter(e=>e.k)),...shuf(EV.filter(e=>!e.k))]:shuf(EV);S.qs=pool.slice(0,10)}S.sc=S.names.map(()=>[]);S.rw={coins:0,xp:0,unl:[]};S.used=[];S.ab={};S.hints=[];S.qi=0;S.pi=0;S.early=false;S.scr='play';S.step=S.np>1?'pass':'ask';S.locked=false;S.o=opts(S.qs[0]);S.focus=1;break;
 case 'ready':S.step='ask';S.focus=1;break;case 'pick':submit(S.o[+v]);return;case 'skip':submit(null);return;case 'say':try{speechSynthesis.speak(new SpeechSynthesisUtterance(S.qs[S.qi].t+'. '+S.qs[S.qi].c))}catch(e){}return;
 case 'sub':{const r=parseDate($('#ans').value);S.txt=$('#ans').value;if(r.err){S.msg=r.err;S.cands=null;S.focus=1}else if(r.cands.length>1){S.cands=r.cands;S.msg='I found more than one possible date. Please choose one, or edit your text.'}else{if(S.ab.second&&!S.ab.sdone){S.ab.sdone=1;S.msg='Second Chance: check your answer. Edit it, or press Submit again to lock it in.';break}submit(r.cands[0]);return}break}
 case 'cand':submit(S.cands[+v]);return;
 case 'next':S.locked=false;S.pi++;if(S.pi===S.np){S.pi=0;S.qi++}if(S.qi===S.qs.length){finish(false);return}S.step=S.np>1?'pass':'ask';S.o=opts(S.qs[S.qi]);S.ab={};S.hints=[];S.msg='';S.focus=1;break;
 case 'end':if(confirm('End the round now? Unanswered questions earn nothing.'))finish(true);return;
 case 'tab':S.tab=v;S.msg='';break;case 'equip':P[KEY[IT.find(i=>i[0]===v)[2]]]=v;save();break;
 case 'buy':{const i=IT.find(z=>z[0]===v);if(P.coins>=i[3]&&confirm('Buy '+i[1]+' for '+i[3]+' Pie Coins?')){P.coins-=i[3];P.own.push(v);P[KEY[i[2]]]=v;save();S.msg='Unlocked '+i[1]+'!';burst(24)}break}
 case 'ab':{const a=AB.find(z=>z[0]===v),q=S.qs[S.qi];if(S.ab[v]||S.locked)return;if(P.ch[v]>0)P.ch[v]--;else if(P.coins>=a[3])P.coins-=a[3];else return;S.ab[v]=1;S.used.push(a[1]);
  if(v==='lens')S.hints.push(`History Lens: topic is ${q.tp}, region is ${q.rg}.`);if(v==='decade')S.hints.push(`Decade Peek: it happened in the ${Math.floor(q.y/10)*10}s.`);
  if(v==='compass'){const o=10+rnd(30),up=rnd(2);S.hints.push(`Chrono Compass: it was ${up?'later':'earlier'} than ${up?q.y-o:q.y+o}.`)}
  if(v==='whisk'){const w=S.o.map((x,i)=>i).filter(i=>S.o[i].y!==q.y);S.o.splice(w[rnd(w.length)],1);S.hints.push('Option Whisk: one wrong choice is gone.')}
  if(v==='second')S.hints.push('Second Chance ready: you can check your typed answer once.');if(v==='gold')S.hints.push('Golden Crust ready: a small bonus if you answer.');save();burst(8);break}
 case 'again':act('start');return;case 'pie':st.pf.pie=v;save();break;case 'snd':st.pf.snd=!st.pf.snd;save();break;case 'anim':st.pf.anim=!st.pf.anim;save();break}
 render()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&!b.disabled)act(b.dataset.a,b.dataset.v)});
document.addEventListener('input',e=>{if(e.target.dataset.n!==undefined)S.names[+e.target.dataset.n]=e.target.value});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='ans'){e.preventDefault();act('sub')}});
render();
</script></body></html>
